name: Verify VARINO

on:
  pull_request:
    # No filtrar por rama base: las PR apiladas también deben validar.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # npm 11 is pinned because npm 10 cannot consume this lockfile's scoped
        # overrides for patched transitive undici versions.
        run: npx --yes npm@11.19.1 ci
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and readiness checks
        run: npm run readiness
      - name: Unit tests
        run: npm run test:unit
      - name: n8n backup failure and WAL tests (synthetic data only)
        run: npm run test:n8n-backup
      - name: Unsubscribe workflow contract (offline synthetic data only)
        run: npm run test:unsubscribe-workflow
      - name: Pages Functions typecheck and bundle
        run: npm run functions:typecheck && npm run functions:build
      - name: Cloudflare Pages runtime smoke (local only)
        run: npm run test:pages-runtime
      - name: D1 schema isolation tests (local only)
        run: npm run test:d1
      - name: Auth/workspace runtime tests (local only)
        run: npm run test:auth-runtime
      - name: Google login abuse control (local only)
        run: npm run test:oauth-rate-limit
      - name: Document queue and worker runtime (local D1 and HTTP stub only)
        run: npm run test:document-jobs
      - name: Inbound buffer and serialized delivery (local D1 and HTTP stub only)
        run: npm run test:inbound
      - name: Durable opt-out and restart safety (local D1, browser and HTTP stub only)
        run: npm run test:suppression
      - name: Claims audit
        run: npm run claims:check
      - name: Security headers audit
        run: npm run security:headers
      - name: Browser tests
        run: npm run test:e2e
